---
- name: Update Ubuntu package repository
  ansible.builtin.apt:
    update_cache: yes

- name: Install Nagios dependencies
  ansible.builtin.apt:
    name:
      - autoconf
      - gcc
      - libc6
      - make
      - wget
      - unzip
      - apache2
      - php
      - libapache2-mod-php
      - libgd-dev
      - ufw
      - openssl
      - libssl-dev
    state: present

- name: Create Nagios group
  ansible.builtin.group:
    name: nagios
    state: present

- name: Create Nagios user
  ansible.builtin.user:
    name: nagios
    group: nagios
    state: present

- name: Add www-data to Nagios group
  ansible.builtin.user:
    name: www-data
    groups: nagios
    append: yes

- name: Download Nagios Core
  ansible.builtin.get_url:
    url: https://github.com/NagiosEnterprises/nagioscore/archive/refs/tags/nagios-4.5.14.tar.gz
    dest: /tmp/nagioscore.tar.gz

- name: Extract Nagios Core
  ansible.builtin.unarchive:
    src: /tmp/nagioscore.tar.gz
    dest: /tmp
    remote_src: yes

- name: Find Nagios source directory
  ansible.builtin.shell: "find /tmp -maxdepth 1 -type d -name 'nagioscore-nagios-*' | head -1"
  register: nagios_dir
  changed_when: false

- name: Configure Nagios
  ansible.builtin.command:
    cmd: ./configure --with-httpd-conf=/etc/apache2/conf-available
    chdir: "{{ nagios_dir.stdout }}"

- name: Compile Nagios
  ansible.builtin.command:
    cmd: make all
    chdir: "{{ nagios_dir.stdout }}"

- name: Install Nagios
  ansible.builtin.command:
    cmd: make install
    chdir: "{{ nagios_dir.stdout }}"

- name: Install Nagios command mode
  ansible.builtin.command:
    cmd: make install-commandmode
    chdir: "{{ nagios_dir.stdout }}"

- name: Install Nagios configuration
  ansible.builtin.command:
    cmd: make install-config
    chdir: "{{ nagios_dir.stdout }}"

- name: Install Nagios web configuration
  ansible.builtin.command:
    cmd: make install-webconf
    chdir: "{{ nagios_dir.stdout }}"

- name: Create Nagios web authentication file
  ansible.builtin.command:
    cmd: htpasswd -bc /usr/local/nagios/etc/htpasswd.users nagiosadmin ProwiththeDark
    creates: /usr/local/nagios/etc/htpasswd.users

- name: Enable Apache rewrite module
  ansible.builtin.command:
    cmd: a2enmod rewrite

- name: Enable Apache CGI module
  ansible.builtin.command:
    cmd: a2enmod cgi

- name: Allow Apache through UFW
  ansible.builtin.command:
    cmd: ufw allow Apache

- name: Reload UFW
  ansible.builtin.command:
    cmd: ufw reload

- name: Install Nagios daemon
  ansible.builtin.command:
    cmd: make install-daemoninit
    chdir: "{{ nagios_dir.stdout }}"

- name: Restart Apache
  ansible.builtin.systemd_service:
    name: apache2
    state: restarted

- name: Start Nagios
  ansible.builtin.systemd_service:
    name: nagios
    state: started

- name: Enable Nagios at boot
  ansible.builtin.systemd_service:
    name: nagios
    enabled: yes


